name: Continuous Integration & Cache Warmup

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Keep GitHub Actions cache warm every Sunday at 00:00 UTC (prevents 7-day eviction)
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    name: Check & Cache (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mold \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend type & integrity check
        run: bun run check

      - name: Compile backend release dependencies
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cd src-tauri
          cargo build --release

  check-windows:
    name: Check & Cache (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Compile backend release dependencies
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          cd src-tauri
          cargo build --release
