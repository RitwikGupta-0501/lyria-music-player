name: Release Lyria

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: 1
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_targets: "deb,rpm,appimage"
            rustflags: "-C link-arg=-fuse-ld=mold"
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_targets: "nsis,msi"
            rustflags: "-C link-arg=-fuse-ld=lld"
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            bundle_targets: "dmg,app"
            rustflags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mold \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm \
            ruby \
            ruby-dev \
            libarchive-tools \
            zstd
          sudo gem install --no-document fpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Extract Changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## / { exit }
            found && /^---/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Minimal, algorithmically-driven audio player." > RELEASE_NOTES.md
          fi

          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lyria ${{ github.ref_name }}"
          releaseBody: |
            ## Lyria ${{ github.ref_name }}

            ${{ steps.changelog.outputs.body }}

            ### Included Release Assets
            * **macOS (Apple Silicon)**: `.dmg` (Disk Image Installer) & `.app.tar.gz`
            * **Windows**: `.exe` (NSIS Wizard Installer) & `.msi` (Enterprise MSI Installer)
            * **Debian / Ubuntu**: `.deb`
            * **Fedora / RHEL / openSUSE**: `.rpm`
            * **Universal Linux**: `.AppImage`
            * **Arch Linux / CachyOS / Manjaro**: `.pkg.tar.zst`
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.platform.bundle_targets }}

      - name: Build & Upload Arch Linux Package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_FILE=$(find src-tauri/target -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "Error: No .deb file found in src-tauri/target!" >&2
            exit 1
          fi

          echo "Found Debian package: $DEB_FILE"
          STAGING_DIR="$(mktemp -d)"
          dpkg-deb -x "$DEB_FILE" "$STAGING_DIR"

          ARCH_PKG="lyria-${VERSION}-1-x86_64.pkg.tar.zst"
          echo "Packaging $ARCH_PKG using fpm..."

          fpm -s dir -t pacman \
            -n lyria \
            -v "$VERSION" \
            --iteration 1 \
            -a x86_64 \
            --description "Minimal, algorithmically-driven local audio player" \
            --url "https://github.com/RitwikGupta-0501/lyria-music-player" \
            --license "GPL-3.0" \
            -d "webkit2gtk-4.1" \
            -d "gtk3" \
            -d "alsa-lib" \
            -d "libappindicator-gtk3" \
            --pacman-compression zstd \
            -C "$STAGING_DIR" \
            -p "$ARCH_PKG"

          echo "Uploading $ARCH_PKG to release ${GITHUB_REF_NAME}..."
          gh release upload "${GITHUB_REF_NAME}" "$ARCH_PKG" --clobber
          rm -rf "$STAGING_DIR"

      - name: Sanitize & Re-upload Universal AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "Error: No .AppImage file found in src-tauri/target!" >&2
            exit 1
          fi

          echo "Found AppImage to sanitize: $APPIMAGE"
          chmod +x "$APPIMAGE"

          # Extract AppImage
          "$APPIMAGE" --appimage-extract

          # Scrub conflicting host libraries
          echo "Scrubbing host-dependent display and GPU libraries..."
          rm -f squashfs-root/usr/lib/libwayland*.so*
          rm -f squashfs-root/usr/lib/libEGL*.so*
          rm -f squashfs-root/usr/lib/libGL*.so*
          rm -f squashfs-root/usr/lib/libgbm*.so*
          rm -f squashfs-root/usr/lib/libdrm*.so*

          # Repack using official appimagetool
          curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool --comp zstd squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

          echo "Re-uploading sanitized $APPIMAGE to release ${GITHUB_REF_NAME}..."
          gh release upload "${GITHUB_REF_NAME}" "$APPIMAGE" --clobber
